name: Compilar APK Entre Notas e Girassóis
on:
  push:
    branches: [jogo-luiz-camily]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-entre-notas-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar aplicativo Android
        run: gradle --no-daemon --stacktrace -p android-app :app:assembleDebug
      - name: Preparar download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Entre_Notas_e_Girassois_v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Entre-Notas-Girassois-APK
          path: Entre_Notas_e_Girassois_v1.0.0.apk
          retention-days: 90
      - name: Publicar APK como release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view entre-notas-apk-v1.0.0 >/dev/null 2>&1 && \
            gh release upload entre-notas-apk-v1.0.0 Entre_Notas_e_Girassois_v1.0.0.apk --clobber || \
            gh release create entre-notas-apk-v1.0.0 Entre_Notas_e_Girassois_v1.0.0.apk --target "$GITHUB_SHA" --title "Entre Notas & Girassóis — APK 1.0.0" --notes "APK Android offline de teste, assinado com uma chave de desenvolvimento."
