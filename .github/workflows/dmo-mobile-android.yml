name: DMO Mobile Android APK
on:
  push:
    branches: [dmo-mobile-lab]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -oq dmo-mobile-source.zip
      - name: Setup Android build environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
      - name: Import and verify scripts
        shell: bash
        run: |
          set -o pipefail
          cd dmo-mobile
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then exit 1; fi
      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd dmo-mobile
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/dmo-mobile-debug.apk
          test -s build/dmo-mobile-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-world-offline-debug-apk
          path: dmo-mobile/build/dmo-mobile-debug.apk
          if-no-files-found: error
